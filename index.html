<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080b09">
    <meta name="description"
        content="A standalone Avengers: Doomsday preparation watchlist with full and essentials viewing plans.">

    <title>Doomsday Watchlist</title>

    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./app.css">
</head>

<body>
    <div id="app">

        <header class="app-header">
            <button id="homeButton" class="brand-button">
                <span>
                    <span class="eyebrow">Countdown to Doomsday</span>
                    <strong>Doomsday Watchlist</strong>
                </span>
            </button>

            <button id="refreshButton" class="refresh-button">
                ↻ <span>Refresh</span>
            </button>
        </header>

        <main>

            <section id="homeView" class="view active">
                <div class="home-intro">
                    <div>
                        <p class="eyebrow">Prepare for the end</p>

                        <h1>Choose Your Watchlist</h1>

                        <p>
                            Follow the complete Marvel prep order or take the
                            streamlined essentials route to Avengers: Doomsday.
                        </p>
                    </div>
                </div>

                <div id="playlistGrid" class="playlist-grid"></div>
            </section>

            <section id="detailView" class="view">
                <div id="playlistDetail"></div>
            </section>

        </main>

    </div>

    <script type="module" src="./app.js"></script>
</body>

</html>
